<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>C.I.P.H.E.R. // 3D Mechanical Cypher-Wheel</title>
  <link rel="stylesheet" href="css/cipher-style.css?v=4.20">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    /* Compact Handheld Frame Layout */
    .wheel-main-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: radial-gradient(circle at center, #0e1e12 0%, #050a06 100%);
      overflow: hidden;
      touch-action: none;
    }

    /* 3D WebGL Canvas Region */
    #webgl-canvas-box {
      flex: 1;
      width: 100%;
      min-height: 240px;
      cursor: grab;
    }
    #webgl-canvas-box:active { cursor: grabbing; }

    /* Upper Interactive HUD Overlays */
    .wheel-top-legend {
      position: absolute;
      top: 8px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: bold;
      z-index: 10;
    }

    /* Compact Bottom Control Deck */
    .hud-control-deck {
      background-color: var(--bg-surface);
      border-top: 2px solid var(--border-bright);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 25;
      flex-shrink: 0;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.95);
    }

    .clue-callout-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #06110a;
      border: 1px dashed var(--accent-amber);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
    }

    /* Mechanical Split-Flap Tumbler Display */
    .tumbler-chamber {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      background-color: #040905;
      border: 1.5px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 4px;
      position: relative;
    }
    .tumbler-chamber.unlocked-all {
      border-color: var(--border-bright);
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.35);
    }
    .tumbler-pin {
      width: 22px;
      height: 34px;
      background: linear-gradient(180deg, #132418 48%, #08130b 52%);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 0.15s ease;
    }
    .tumbler-pin.anchor-match {
      border-color: var(--accent-amber);
      color: var(--accent-amber);
      box-shadow: 0 0 8px rgba(255, 179, 0, 0.5);
    }
    .tumbler-pin.solved-gold {
      border-color: var(--border-bright);
      color: var(--border-bright);
      background: linear-gradient(180deg, #1b3d24 48%, #0a1f11 52%);
      box-shadow: 0 0 8px rgba(0, 230, 118, 0.6);
    }
    .tumbler-spacer {
      width: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-weight: bold;
      font-size: 14px;
    }

    /* Heterodyne Acoustic Tuning Gauge */
    .lock-progress-track {
      width: 100%;
      height: 6px;
      background-color: #06110a;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      overflow: hidden;
    }
    .lock-progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent-amber);
      transition: width 0.1s linear, background-color 0.15s ease;
    }
    .lock-progress-fill.locked {
      background-color: var(--border-bright);
      box-shadow: 0 0 8px var(--border-bright);
    }

    /* Stepping Controls */
    .rotor-button-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 6px;
    }

    .btn-slam-cost {
      background-color: #1a3320;
      color: var(--text-bright);
      border: 1.5px solid var(--border-bright);
      min-height: 44px;
      font-size: 12px;
      font-weight: 800;
      padding: 0 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      touch-action: manipulation;
    }
    .btn-slam-cost:active {
      background-color: var(--border-bright);
      color: #000000;
    }

    /* Action Footer Buttons */
    .action-button-deck {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-copy-done {
      border: 1.5px solid var(--accent-amber);
      color: var(--accent-amber);
      background-color: #17150a;
      min-height: 44px;
      font-size: 13px;
      font-weight: bold;
      touch-action: manipulation;
    }
    .btn-copy-done.copied {
      border-color: var(--border-bright);
      color: var(--text-bright);
      background-color: #0b2413;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header with Explicit Return Links -->
    <header class="status-header">
      <span class="brand-title">C.I.P.H.E.R. // 3D ROTOR</span>
      <div style="display: flex; gap: 6px;">
        <button class="btn-cipher" style="min-height: 36px; padding: 0 10px; font-size: 11px;" onclick="WheelMaster.returnTo('mission.html')">
          [ 🔓 MISSION ]
        </button>
        <button class="btn-cipher" style="min-height: 36px; padding: 0 10px; font-size: 11px;" onclick="WheelMaster.returnTo('pack.html')">
          [ 🎒 PACK ]
        </button>
      </div>
    </header>

    <main class="wheel-main-stage">
      
      <!-- In-World Interaction Guidance -->
      <div class="wheel-top-legend">
        <span style="color: var(--accent-amber);">◄ DRAG OUTER BRASS RING</span>
        <span id="power-hud-tag" style="color: var(--accent-amber);">BATTERY: 12.6V</span>
        <span style="color: var(--text-bright);">DRAG INNER ROTOR ►</span>
      </div>

      <!-- Real Three.js WebGL 3D Cylinder Stage -->
      <div id="webgl-canvas-box" aria-label="3D Interactive Mechanical Rotor Canvas"></div>

      <!-- Docked Bottom Control Panel -->
      <section class="hud-control-deck">
        
        <!-- Target Clue & Offset Banner -->
        <div class="clue-callout-row">
          <div>
            <span style="color: var(--text-dim); font-size: 11px; font-family: var(--font-mono);">DECODE ANCHOR:</span>
            <strong id="target-clue-badge" style="color: var(--text-bright); font-size: 14px;">"THS"</strong>
          </div>
          <div style="text-align: right; font-family: var(--font-mono);">
            <span style="font-size: 11px; color: var(--text-dim);">NET SHIFT:</span>
            <strong id="net-shift-txt" style="color: var(--accent-amber); font-size: 15px;">ROT-00</strong>
          </div>
        </div>

        <!-- Split-Flap Character Rack -->
        <div class="tumbler-chamber" id="tumbler-pins-rack" aria-live="polite"></div>

        <!-- Alignment Lock Gauge -->
        <div class="lock-progress-track">
          <div id="lock-gauge-bar" class="lock-progress-fill"></div>
        </div>

        <!-- Stepping & Resource-Gated Solenoid Slam -->
        <div class="rotor-button-grid">
          <button class="btn-cipher" style="min-height: 44px; font-size: 13px;" onclick="WheelMaster.stepRotor(-1)">◄ STEP</button>
          
          <button class="btn-cipher btn-slam-cost" id="btn-solenoid-slam" onclick="WheelMaster.executeSolenoidSlam()">
            <span>⚡ COIL SLAM</span>
            <span id="slam-cost-label" style="font-size: 10px; color: var(--accent-amber);">DISCHARGE -0.4V</span>
          </button>
          
          <button class="btn-cipher" style="min-height: 44px; font-size: 13px;" onclick="WheelMaster.stepRotor(1)">STEP ►</button>
        </div>

        <!-- Sticky Result & Export Actions (Always Visible on Handheld Screen) -->
        <div class="action-button-deck">
          <button id="btn-copy-code" class="btn-cipher btn-copy-done" onclick="WheelMaster.copyCodeword()">
            📋 COPY CODE
          </button>
          <button id="btn-auto-inject" class="btn-cipher primary-solid" style="min-height: 44px; font-size: 13px;" onclick="WheelMaster.autoInject()">
            ⚡ AUTO-INJECT ➔
          </button>
        </div>

      </section>
    </main>
  </div>

  <script src="js/cipher-audio.js"></script>
  <script src="js/cipher-core.js"></script>
  <script>
    /**
     * C.I.P.H.E.R. 3D WebGL Mechanical Decoder & Battery Resource Engine
     */
    const WheelMaster = (function () {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      let scene, camera, renderer;
      let outerMesh, innerMesh, hubMesh;
      let raycaster, mouse;

      // Rotational State
      let outerAngle = 0;
      let innerAngle = 0;
      let outerOffset = 0;
      let innerOffset = 0;
      let netShift = 0;

      // Touch & Drag Physics
      let activeDisk = null;
      let isDragging = false;
      let previousAngle = 0;
      let angularVelocity = 0;

      // Cipher Payload & Context
      let cipherText = "GUF-SYNAP-HAX-89";
      let targetPrefix = "THS";
      let solvedCodeword = "";
      let returnUrl = "mission.html";

      function init() {
        parseParameters();
        setupThreeEngine();
        create3DDisks();
        bindTouchInteractions();
        updatePowerHud();
        animateLoop();
        updateDecryption();
      }

      function parseParameters() {
        const p = new URLSearchParams(window.location.search);
        if (p.has('cipher')) cipherText = decodeURIComponent(p.get('cipher')).toUpperCase();
        if (p.has('target')) targetPrefix = decodeURIComponent(p.get('target')).toUpperCase();
        if (p.has('return')) returnUrl = p.get('return');

        document.getElementById('target-clue-badge').textContent = `"${targetPrefix}"`;
      }

      function updatePowerHud() {
        const state = (typeof CipherCore !== 'undefined') ? CipherCore.getState() : { hardware: { batteryVolts: 12.6 } };
        const v = state.hardware.batteryVolts;
        document.getElementById('power-hud-tag').textContent = `BATTERY: ${v.toFixed(1)}V`;
        document.getElementById('power-hud-tag').style.color = v < 12.0 ? 'var(--accent-alert)' : 'var(--text-bright)';
      }

      function setupThreeEngine() {
        const container = document.getElementById('webgl-canvas-box');
        const w = container.clientWidth;
        const h = container.clientHeight;

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(38, w / h, 0.1, 1000);
        camera.position.set(0, -6.8, 9.5);
        camera.lookAt(0, -0.3, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        // 3D Lighting Rig
        const ambient = new THREE.AmbientLight(0xd4edd9, 0.65);
        scene.add(ambient);

        const keyLight = new THREE.DirectionalLight(0xfff1cc, 1.3);
        keyLight.position.set(5, -4, 10);
        keyLight.castShadow = true;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x00e676, 0.4);
        fillLight.position.set(-6, 6, 4);
        scene.add(fillLight);
      }

      function makeRingTexture(isOuter) {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 1024, 1024);

        const cx = 512;
        const cy = 512;
        const radius = isOuter ? 430 : 280;

        ctx.font = 'bold 44px "Courier New", Courier, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (let i = 0; i < 26; i++) {
          const char = alphabet[i];
          const angle = (i * (360 / 26)) * (Math.PI / 180) - Math.PI / 2;
          const x = cx + Math.cos(angle) * radius;
          const y = cy + Math.sin(angle) * radius;

          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle + Math.PI / 2);

          // Specular Shadow
          ctx.fillStyle = '#000000';
          ctx.fillText(char, 2, 2);

          // Face Lettering
          ctx.fillStyle = isOuter ? '#ffda73' : '#00e676';
          ctx.fillText(char, 0, 0);

          // Detent Tick Mark
          ctx.fillStyle = isOuter ? '#ffb300' : '#1b5e20';
          ctx.fillRect(-2, isOuter ? 32 : 24, 4, 14);

          ctx.restore();
        }

        return canvas;
      }

      function create3DDisks() {
        const rootGroup = new THREE.Group();

        // 1. Outer Brass Cylinder Disk
        const outerGeo = new THREE.CylinderGeometry(4.2, 4.2, 0.42, 64);
        const outerTex = new THREE.CanvasTexture(makeRingTexture(true));
        outerTex.anisotropy = 8;

        const outerMat = [
          new THREE.MeshStandardMaterial({ color: 0x3d3215, roughness: 0.4, metalness: 0.85 }),
          new THREE.MeshStandardMaterial({ map: outerTex, roughness: 0.35, metalness: 0.8 }),
          new THREE.MeshStandardMaterial({ color: 0x1a1508, roughness: 0.8, metalness: 0.9 })
        ];
        outerMesh = new THREE.Mesh(outerGeo, outerMat);
        outerMesh.rotation.x = Math.PI / 2;
        outerMesh.name = "OUTER_DISK";
        rootGroup.add(outerMesh);

        // 2. Inner Steel/Phosphor Disk
        const innerGeo = new THREE.CylinderGeometry(2.7, 2.7, 0.65, 64);
        const innerTex = new THREE.CanvasTexture(makeRingTexture(false));
        innerTex.anisotropy = 8;

        const innerMat = [
          new THREE.MeshStandardMaterial({ color: 0x173822, roughness: 0.3, metalness: 0.75 }),
          new THREE.MeshStandardMaterial({ map: innerTex, roughness: 0.25, metalness: 0.7 }),
          new THREE.MeshStandardMaterial({ color: 0x050a06, roughness: 0.9, metalness: 0.9 })
        ];
        innerMesh = new THREE.Mesh(innerGeo, innerMat);
        innerMesh.rotation.x = Math.PI / 2;
        innerMesh.position.z = 0.12;
        innerMesh.name = "INNER_DISK";
        rootGroup.add(innerMesh);

        // 3. Center Hub
        const hubGeo = new THREE.CylinderGeometry(1.0, 1.1, 0.85, 32);
        const hubMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.2, metalness: 0.9 });
        hubMesh = new THREE.Mesh(hubGeo, hubMat);
        hubMesh.rotation.x = Math.PI / 2;
        hubMesh.position.z = 0.22;
        rootGroup.add(hubMesh);

        // 4. Hairline Calibration Sight
        const sightGeo = new THREE.BoxGeometry(0.35, 1.2, 0.08);
        const sightMat = new THREE.MeshBasicMaterial({ color: 0xffb300, transparent: true, opacity: 0.9 });
        const sightMesh = new THREE.Mesh(sightGeo, sightMat);
        sightMesh.position.set(0, 3.6, 0.55);
        rootGroup.add(sightMesh);

        scene.add(rootGroup);
      }

      function getPointerAngle(e) {
        const container = document.getElementById('webgl-canvas-box');
        const rect = container.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        return Math.atan2(clientY - cy, clientX - cx);
      }

      function bindTouchInteractions() {
        const container = document.getElementById('webgl-canvas-box');

        const onStart = (e) => {
          e.preventDefault();
          const rect = container.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;

          mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);
          const hits = raycaster.intersectObjects([innerMesh, outerMesh]);

          if (hits.length > 0) {
            isDragging = true;
            activeDisk = (hits[0].object.name === "INNER_DISK") ? 'inner' : 'outer';
            previousAngle = getPointerAngle(e);
            angularVelocity = 0;
          }
        };

        const onMove = (e) => {
          if (!isDragging) return;
          e.preventDefault();
          const current = getPointerAngle(e);
          const delta = current - previousAngle;
          previousAngle = current;
          angularVelocity = delta;

          if (activeDisk === 'inner') {
            innerAngle -= delta;
            innerMesh.rotation.y = innerAngle;
          } else {
            outerAngle -= delta;
            outerMesh.rotation.y = outerAngle;
          }

          calculateDetents();
        };

        const onEnd = () => {
          isDragging = false;
        };

        container.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        container.addEventListener('touchstart', onStart, { passive: false });
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onEnd);

        window.addEventListener('resize', () => {
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        });
      }

      function calculateDetents() {
        const radPerSlot = (Math.PI * 2) / 26;
        const newOuter = Math.round((outerAngle / radPerSlot) % 26 + 26) % 26;
        const newInner = Math.round((innerAngle / radPerSlot) % 26 + 26) % 26;

        let changed = false;

        if (newOuter !== outerOffset) {
          outerOffset = newOuter;
          if (typeof CipherAudio !== 'undefined') CipherAudio.wheelTick(true);
          changed = true;
        }

        if (newInner !== innerOffset) {
          innerOffset = newInner;
          if (typeof CipherAudio !== 'undefined') CipherAudio.wheelTick(false);
          changed = true;
        }

        if (changed) updateDecryption();
      }

      function updateDecryption() {
        netShift = (innerOffset - outerOffset + 26) % 26;
        document.getElementById('net-shift-txt').textContent = `ROT-${netShift.toString().padStart(2, '0')}`;

        // Live calculation
        let output = "";
        for (let char of cipherText) {
          if (alphabet.includes(char)) {
            const idx = alphabet.indexOf(char);
            output += alphabet[(idx - netShift + 26) % 26];
          } else {
            output += char;
          }
        }
        solvedCodeword = output;

        // Render Tumbler Pins
        const rack = document.getElementById('tumbler-pins-rack');
        rack.innerHTML = '';

        const isAnchorHit = targetPrefix && output.startsWith(targetPrefix);
        const isFullRot13 = netShift === 13;

        let letterCount = 0;
        for (let char of output) {
          if (char === '-') {
            const sep = document.createElement('div');
            sep.className = 'tumbler-spacer';
            sep.textContent = '-';
            rack.appendChild(sep);
          } else {
            const pin = document.createElement('div');
            const isAnchorChar = letterCount < targetPrefix.length && isAnchorHit;
            pin.className = `tumbler-pin ${isFullRot13 ? 'solved-gold' : (isAnchorChar ? 'anchor-match' : '')}`;
            pin.textContent = char;
            rack.appendChild(pin);
            letterCount++;
          }
        }

        // Lock progress
        const gauge = document.getElementById('lock-gauge-bar');
        if (isAnchorHit || isFullRot13) {
          rack.classList.add('unlocked-all');
          gauge.classList.add('locked');
          gauge.style.width = '100%';
        } else {
          rack.classList.remove('unlocked-all');
          gauge.classList.remove('locked');
          const prox = Math.max(10, Math.round((1 - Math.abs(13 - netShift) / 13) * 100));
          gauge.style.width = `${prox}%`;
        }
      }

      function animateLoop() {
        requestAnimationFrame(animateLoop);

        // Momentum glide physics
        if (!isDragging && Math.abs(angularVelocity) > 0.001) {
          angularVelocity *= 0.92;
          if (activeDisk === 'inner') {
            innerAngle -= angularVelocity;
            innerMesh.rotation.y = innerAngle;
          } else if (activeDisk === 'outer') {
            outerAngle -= angularVelocity;
            outerMesh.rotation.y = outerAngle;
          }
          calculateDetents();
        }

        renderer.render(scene, camera);
      }

      return {
        init: init,

        stepRotor: function (dir) {
          innerOffset = (innerOffset + dir + 26) % 26;
          const radPerSlot = (Math.PI * 2) / 26;
          innerAngle = innerOffset * radPerSlot;
          innerMesh.rotation.y = innerAngle;
          if (typeof CipherAudio !== 'undefined') CipherAudio.wheelTick(false);
          updateDecryption();
        },

        // Gated Solenoid Slam (Costs -0.4V Battery Resource)
        executeSolenoidSlam: function () {
          const state = (typeof CipherCore !== 'undefined') ? CipherCore.getState() : { hardware: { batteryVolts: 12.6 } };

          if (state.hardware.batteryVolts < 12.0) {
            if (typeof CipherAudio !== 'undefined') CipherAudio.buzz();
            alert("COIL DISCHARGE ABORTED // BROWNOUT RISK\n\nBattery float is under 12.0V! You must feed power components to C.I.P.H.E.R. in your Pack to stabilize the solenoid latch.");
            return;
          }

          // Deduct Resource
          state.hardware.batteryVolts = Math.round((state.hardware.batteryVolts - 0.4) * 10) / 10;
          if (typeof CipherCore !== 'undefined') CipherCore.commitMilestone('SOLENOID_DISCHARGE', { voltsLeft: state.hardware.batteryVolts });

          updatePowerHud();

          // Fire Heavy Mechanical Solenoid Audio
          if (typeof CipherAudio !== 'undefined') {
            CipherAudio.wheelSlam();
            CipherAudio.speak("Solenoid capacitor discharged. Rotor snapped to offset 13.");
          }

          // Reset Outer and Lock Inner to 13
          outerOffset = 0;
          outerAngle = 0;
          outerMesh.rotation.y = 0;

          innerOffset = 13;
          const radPerSlot = (Math.PI * 2) / 26;
          innerAngle = innerOffset * radPerSlot;
          innerMesh.rotation.y = innerAngle;

          updateDecryption();
        },

        copyCodeword: function () {
          navigator.clipboard.writeText(solvedCodeword).then(() => {
            if (typeof CipherAudio !== 'undefined') CipherAudio.click();
            const btn = document.getElementById('btn-copy-code');
            btn.classList.add('copied');
            btn.textContent = '✔ COPIED!';
            setTimeout(() => {
              btn.classList.remove('copied');
              btn.textContent = '📋 COPY CODE';
            }, 1800);
          });
        },

        autoInject: function () {
          if (typeof CipherAudio !== 'undefined') {
            CipherAudio.chime();
            CipherAudio.speak("Codeword verified. Transferring directly into terminal.");
          }
          sessionStorage.setItem('INJECTED_CRACK_CODE', solvedCodeword);
          window.location.href = returnUrl;
        },

        returnTo: function (dest) {
          if (typeof CipherAudio !== 'undefined') CipherAudio.click();
          window.location.href = dest;
        }
      };
    })();

    document.addEventListener('DOMContentLoaded', () => {
      WheelMaster.init();
    });
  </script>
</body>
</html>
