<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>C.I.P.H.E.R. // 3D Mechanical Cypher-Wheel</title>
  <link rel="stylesheet" href="css/cipher-style.css?v=4.10">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    .wheel-container-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: radial-gradient(circle at center, #0e1e12 0%, #050a06 100%);
      overflow: hidden;
      touch-action: none;
    }

    #webgl-canvas-box {
      flex: 1;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #webgl-canvas-box:active { cursor: grabbing; }

    /* Control HUD Bar */
    .hud-controls-panel {
      background-color: var(--bg-surface);
      border-top: 2px solid var(--border-bright);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
      flex-shrink: 0;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.9);
    }

    /* Clue Banner */
    .clue-banner-hud {
      background-color: #06110a;
      border: 1px dashed var(--accent-amber);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: var(--font-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Split-Flap Tumbler Display */
    .tumbler-strip {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      background-color: #040905;
      border: 1.5px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 6px;
    }
    .tumbler-char {
      width: 24px;
      height: 36px;
      background: linear-gradient(180deg, #14281a 48%, #08130b 52%);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .tumbler-char.locked {
      border-color: var(--border-bright);
      color: var(--border-bright);
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.6);
    }
    .tumbler-sep {
      width: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-weight: bold;
    }

    .alignment-bar-wrap {
      height: 8px;
      background-color: #06110a;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      overflow: hidden;
    }
    .alignment-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent-amber);
      transition: width 0.15s ease, background-color 0.15s ease;
    }
    .alignment-bar-fill.locked {
      background-color: var(--border-bright);
      box-shadow: 0 0 8px var(--border-bright);
    }

    .interactive-legend {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: bold;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header with Explicit Return Links -->
    <header class="status-header">
      <span class="brand-title">C.I.P.H.E.R. // 3D DISK</span>
      <div style="display: flex; gap: 8px;">
        <button class="btn-cipher" style="min-height: 36px; padding: 0 12px; font-size: 12px;" onclick="WheelMaster.returnToCaller('mission.html')">
          [ 🔓 MISSION ]
        </button>
        <button class="btn-cipher" style="min-height: 36px; padding: 0 12px; font-size: 12px;" onclick="WheelMaster.returnToCaller('pack.html')">
          [ 🎒 PACK ]
        </button>
      </div>
    </header>

    <main class="wheel-container-stage">
      
      <!-- Interactive Touch Hints -->
      <div class="interactive-legend">
        <span style="color: var(--accent-amber);">◄ DRAG OUTER BRASS RING</span>
        <span style="color: var(--text-bright);">DRAG INNER ROTOR ►</span>
      </div>

      <!-- WebGL 3D Canvas Viewport -->
      <div id="webgl-canvas-box" aria-label="3D Rotatable Mechanical Cipher Disks"></div>

      <!-- Bottom HUD & Decryption Controls -->
      <section class="hud-controls-panel">
        
        <!-- Target Deduction Clue -->
        <div class="clue-banner-hud">
          <div>
            <div class="section-category-tag" style="margin: 0;">LOG HINT DECRYPTION TARGET:</div>
            <div style="color: #ffffff;">Target anchor prefix: <strong style="color: var(--text-bright);">"THS"</strong></div>
          </div>
          <div style="text-align: right; font-family: var(--font-mono);">
            <div style="font-size: 11px; color: var(--text-dim);">NET SHIFT:</div>
            <strong id="hud-offset-txt" style="color: var(--accent-amber); font-size: 16px;">ROT-00</strong>
          </div>
        </div>

        <!-- Mechanical Tumbler Character Stream -->
        <div class="tumbler-strip" id="tumbler-display-strip" aria-live="polite"></div>

        <!-- Alignment Lock Gauge -->
        <div class="alignment-bar-wrap">
          <div id="hud-align-fill" class="alignment-bar-fill"></div>
        </div>

        <!-- Mechanical Stepping & Quick Slam Levers -->
        <div style="display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 8px;">
          <button class="btn-cipher" onclick="WheelMaster.stepRotor(-1)">◄ STEP</button>
          <button class="btn-cipher primary-solid" onclick="WheelMaster.slamOffset(13)">⚡ SLAM ROT-13</button>
          <button class="btn-cipher" onclick="WheelMaster.stepRotor(1)">STEP ►</button>
        </div>

        <!-- Inject / Transfer Output Button -->
        <button 
          id="btn-auto-inject" 
          class="btn-cipher primary-solid" 
          style="min-height: 48px;" 
          onclick="WheelMaster.injectCodeword()"
        >
          ⚡ AUTO-INJECT INTO MISSION TERMINAL ➔
        </button>

      </section>
    </main>
  </div>

  <script src="js/cipher-audio.js"></script>
  <script src="js/cipher-core.js"></script>
  <script>
    /**
     * C.I.P.H.E.R. Three.js Mechanical 3D Engine
     * Generates real 3D geometry cylinders with dynamic lighting, specular reflection,
     * independent touch raycasting, momentum physics, and detent audio.
     */
    const WheelMaster = (function () {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      let scene, camera, renderer;
      let outerMesh, innerMesh, hubMesh;
      let raycaster, mouse;

      // Rotational State (in radians)
      let outerAngle = 0;
      let innerAngle = 0;
      let outerOffset = 0;
      let innerOffset = 0;
      let netShift = 0;

      // Interaction Physics
      let activeDisk = null; // 'outer' | 'inner'
      let isDragging = false;
      let previousAngle = 0;
      let angularVelocity = 0;

      // Cipher Payload
      let cipherText = "GUF-SYNAP-HAX-89";
      let targetPrefix = "THS";
      let solvedString = "";
      let returnUrl = "mission.html";

      function init() {
        parseParameters();
        setupThree();
        createWheelGeometry();
        setupEvents();
        animate();
        updateDecoder();
      }

      function parseParameters() {
        const p = new URLSearchParams(window.location.search);
        if (p.has('cipher')) cipherText = decodeURIComponent(p.get('cipher')).toUpperCase();
        if (p.has('target')) targetPrefix = decodeURIComponent(p.get('target')).toUpperCase();
        if (p.has('return')) returnUrl = p.get('return');
      }

      function setupThree() {
        const container = document.getElementById('webgl-canvas-box');
        const w = container.clientWidth;
        const h = container.clientHeight;

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(38, w / h, 0.1, 1000);
        camera.position.set(0, -6.5, 9.5);
        camera.lookAt(0, -0.4, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        // 3D Lighting (Industrial Cold War Lamp Rig)
        const ambient = new THREE.AmbientLight(0xd4edd9, 0.65);
        scene.add(ambient);

        const keyLight = new THREE.DirectionalLight(0xfff1cc, 1.2);
        keyLight.position.set(5, -4, 10);
        keyLight.castShadow = true;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x00e676, 0.4);
        fillLight.position.set(-6, 6, 4);
        scene.add(fillLight);
      }

      function makeRingCanvas(isOuter) {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, 1024, 1024);

        const cx = 512;
        const cy = 512;
        const radius = isOuter ? 430 : 280;

        ctx.font = 'bold 44px "Courier New", Courier, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (let i = 0; i < 26; i++) {
          const char = alphabet[i];
          const angle = (i * (360 / 26)) * (Math.PI / 180) - Math.PI / 2;
          const x = cx + Math.cos(angle) * radius;
          const y = cy + Math.sin(angle) * radius;

          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle + Math.PI / 2);

          // Shadow
          ctx.fillStyle = '#000000';
          ctx.fillText(char, 2, 2);

          // Letter Fill
          ctx.fillStyle = isOuter ? '#ffda73' : '#00e676';
          ctx.fillText(char, 0, 0);

          // Detent tick mark
          ctx.fillStyle = isOuter ? '#ffb300' : '#1b5e20';
          ctx.fillRect(-2, isOuter ? 32 : 24, 4, 14);

          ctx.restore();
        }

        return canvas;
      }

      function createWheelGeometry() {
        const rootWheelGroup = new THREE.Group();

        // 1. Outer Brass Disk
        const outerGeo = new THREE.CylinderGeometry(4.2, 4.2, 0.42, 64);
        const outerTex = new THREE.CanvasTexture(makeRingCanvas(true));
        outerTex.anisotropy = 8;

        const outerMat = [
          new THREE.MeshStandardMaterial({ color: 0x3d3215, roughness: 0.4, metalness: 0.85 }), // rim
          new THREE.MeshStandardMaterial({ map: outerTex, roughness: 0.35, metalness: 0.8 }),   // top face
          new THREE.MeshStandardMaterial({ color: 0x1a1508, roughness: 0.8, metalness: 0.9 })    // bottom
        ];
        outerMesh = new THREE.Mesh(outerGeo, outerMat);
        outerMesh.rotation.x = Math.PI / 2;
        outerMesh.receiveShadow = true;
        outerMesh.castShadow = true;
        outerMesh.name = "OUTER_DISK";
        rootWheelGroup.add(outerMesh);

        // 2. Inner Steel/Phosphor Disk
        const innerGeo = new THREE.CylinderGeometry(2.7, 2.7, 0.65, 64);
        const innerTex = new THREE.CanvasTexture(makeRingCanvas(false));
        innerTex.anisotropy = 8;

        const innerMat = [
          new THREE.MeshStandardMaterial({ color: 0x173822, roughness: 0.3, metalness: 0.75 }),
          new THREE.MeshStandardMaterial({ map: innerTex, roughness: 0.25, metalness: 0.7 }),
          new THREE.MeshStandardMaterial({ color: 0x050a06, roughness: 0.9, metalness: 0.9 })
        ];
        innerMesh = new THREE.Mesh(innerGeo, innerMat);
        innerMesh.rotation.x = Math.PI / 2;
        innerMesh.position.z = 0.12;
        innerMesh.receiveShadow = true;
        innerMesh.castShadow = true;
        innerMesh.name = "INNER_DISK";
        rootWheelGroup.add(innerMesh);

        // 3. Center Stainless Steel Hub
        const hubGeo = new THREE.CylinderGeometry(1.0, 1.1, 0.85, 32);
        const hubMat = new THREE.MeshStandardMaterial({ color: 0x242424, roughness: 0.2, metalness: 0.9 });
        hubMesh = new THREE.Mesh(hubGeo, hubMat);
        hubMesh.rotation.x = Math.PI / 2;
        hubMesh.position.z = 0.22;
        hubMesh.castShadow = true;
        rootWheelGroup.add(hubMesh);

        // 4. Optical Hairline Sight (Top Calibration Index)
        const sightGeo = new THREE.BoxGeometry(0.35, 1.2, 0.08);
        const sightMat = new THREE.MeshBasicMaterial({ color: 0xffb300, transparent: true, opacity: 0.9 });
        const sightMesh = new THREE.Mesh(sightGeo, sightMat);
        sightMesh.position.set(0, 3.6, 0.55);
        rootWheelGroup.add(sightMesh);

        scene.add(rootWheelGroup);
      }

      function getPointerAngle(e) {
        const container = document.getElementById('webgl-canvas-box');
        const rect = container.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        return Math.atan2(clientY - cy, clientX - cx);
      }

      function setupEvents() {
        const container = document.getElementById('webgl-canvas-box');

        const onStart = (e) => {
          e.preventDefault();
          const rect = container.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;

          mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects([innerMesh, outerMesh]);

          if (intersects.length > 0) {
            isDragging = true;
            activeDisk = (intersects[0].object.name === "INNER_DISK") ? 'inner' : 'outer';
            previousAngle = getPointerAngle(e);
            angularVelocity = 0;
          }
        };

        const onMove = (e) => {
          if (!isDragging) return;
          e.preventDefault();
          const current = getPointerAngle(e);
          const delta = current - previousAngle;
          previousAngle = current;
          angularVelocity = delta;

          if (activeDisk === 'inner') {
            innerAngle -= delta;
            innerMesh.rotation.y = innerAngle;
          } else {
            outerAngle -= delta;
            outerMesh.rotation.y = outerAngle;
          }

          calculateDetents();
        };

        const onEnd = () => {
          if (!isDragging) return;
          isDragging = false;
        };

        container.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        container.addEventListener('touchstart', onStart, { passive: false });
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onEnd);

        window.addEventListener('resize', () => {
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        });
      }

      function calculateDetents() {
        const radPerSlot = (Math.PI * 2) / 26;

        const newOuterOffset = Math.round((outerAngle / radPerSlot) % 26 + 26) % 26;
        const newInnerOffset = Math.round((innerAngle / radPerSlot) % 26 + 26) % 26;

        let changed = false;

        if (newOuterOffset !== outerOffset) {
          outerOffset = newOuterOffset;
          CipherAudio.wheelTick(true);
          changed = true;
        }

        if (newInnerOffset !== innerOffset) {
          innerOffset = newInnerOffset;
          CipherAudio.wheelTick(false);
          changed = true;
        }

        if (changed) {
          updateDecoder();
        }
      }

      function updateDecoder() {
        netShift = (innerOffset - outerOffset + 26) % 26;
        document.getElementById('hud-offset-txt').textContent = `ROT-${netShift.toString().padStart(2, '0')}`;

        // Real-time decryption
        let decoded = "";
        for (let char of cipherText) {
          if (alphabet.includes(char)) {
            const idx = alphabet.indexOf(char);
            decoded += alphabet[(idx - netShift + 26) % 26];
          } else {
            decoded += char;
          }
        }
        solvedString = decoded;

        // Render Tumbler Rack
        const rack = document.getElementById('tumbler-display-strip');
        rack.innerHTML = '';

        const isMatched = targetPrefix && decoded.startsWith(targetPrefix);

        for (let char of decoded) {
          if (char === '-') {
            const sep = document.createElement('div');
            sep.className = 'tumbler-sep';
            sep.textContent = '-';
            rack.appendChild(sep);
          } else {
            const tile = document.createElement('div');
            tile.className = `tumbler-char ${isMatched ? 'locked' : ''}`;
            tile.textContent = char;
            rack.appendChild(tile);
          }
        }

        const gauge = document.getElementById('hud-align-fill');
        const injectBtn = document.getElementById('btn-auto-inject');

        if (isMatched || netShift === 13) {
          gauge.classList.add('locked');
          gauge.style.width = '100%';
          injectBtn.style.display = 'block';
        } else {
          gauge.classList.remove('locked');
          const pct = Math.max(10, Math.round((1 - Math.abs(13 - netShift) / 13) * 100));
          gauge.style.width = `${pct}%`;
          injectBtn.style.display = 'none';
        }
      }

      function animate() {
        requestAnimationFrame(animate);

        // Momentum damping when finger releases
        if (!isDragging && Math.abs(angularVelocity) > 0.001) {
          angularVelocity *= 0.92;
          if (activeDisk === 'inner') {
            innerAngle -= angularVelocity;
            innerMesh.rotation.y = innerAngle;
          } else if (activeDisk === 'outer') {
            outerAngle -= angularVelocity;
            outerMesh.rotation.y = outerAngle;
          }
          calculateDetents();
        }

        renderer.render(scene, camera);
      }

      return {
        init: init,

        stepRotor: function (dir) {
          innerOffset = (innerOffset + dir + 26) % 26;
          const radPerSlot = (Math.PI * 2) / 26;
          innerAngle = innerOffset * radPerSlot;
          innerMesh.rotation.y = innerAngle;
          CipherAudio.wheelTick(false);
          updateDecoder();
        },

        slamOffset: function (targetVal) {
          CipherAudio.wheelSlam();
          outerOffset = 0;
          outerAngle = 0;
          outerMesh.rotation.y = 0;

          innerOffset = targetVal;
          const radPerSlot = (Math.PI * 2) / 26;
          innerAngle = innerOffset * radPerSlot;
          innerMesh.rotation.y = innerAngle;
          updateDecoder();
        },

        injectCodeword: function () {
          CipherAudio.chime();
          CipherAudio.speak("Detent verified. Transferring bypass code to mission.");
          sessionStorage.setItem('INJECTED_CRACK_CODE', solvedString);
          window.location.href = returnUrl;
        },

        returnToCaller: function (dest) {
          CipherAudio.click();
          window.location.href = dest;
        }
      };
    })();

    document.addEventListener('DOMContentLoaded', () => {
      WheelMaster.init();
    });
  </script>
</body>
</html>
