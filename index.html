<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>C.I.P.H.E.R. // Access Protocol</title>
  <style>
    :root {
      --crt-bg: #030804;
      --crt-text-dim: #99e6aa;
      --crt-text-bright: #00ff66;
      --crt-amber: #ffb300;
      --crt-border: #1b5e20;
      --crt-border-bright: #00ff66;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      background-color: var(--crt-bg);
      color: var(--crt-text-bright);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 12px));
    }

    .gateway-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .gateway-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 0 12px var(--crt-text-bright);
      text-align: center;
    }

    .gateway-subtitle {
      font-size: 16px;
      color: var(--crt-text-dim);
      line-height: 1.45;
      text-align: center;
      margin-bottom: 8px;
    }

    .surface-choice-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 84px;
      background-color: #0a2110;
      border: 2.5px solid var(--crt-border-bright);
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      padding: 16px 14px;
      touch-action: manipulation;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .surface-choice-btn:active {
      background-color: var(--crt-border-bright);
      color: #000000;
    }

    .btn-headline {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-align: center;
    }

    .btn-subtext {
      font-size: 13px;
      color: var(--crt-text-dim);
      text-align: center;
      line-height: 1.35;
    }
    .surface-choice-btn:active .btn-subtext {
      color: #000000;
    }

    .recommended-badge {
      font-size: 12px;
      color: var(--crt-amber);
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="gateway-card">
    <div class="gateway-title">RSI HARDWARE INTERFACE</div>
    <div class="gateway-subtitle">
      Select your operational terminal surface to link with C.I.P.H.E.R.:
    </div>

    <!-- Handheld Choice (Mobile-Optimized) -->
    <a href="mobile/index.html" class="surface-choice-btn">
      <span class="recommended-badge" id="badge-handheld">RECOMMENDED FOR THIS DEVICE</span>
      <span class="btn-headline">📱 ACTIVATE FIELD HANDHELD</span>
      <span class="btn-subtext">Optimized for phone, large touch controls & outdoor trail use</span>
    </a>

    <!-- Base Station Choice (Desktop-Optimized) -->
    <a href="desktop/index.html" class="surface-choice-btn">
      <span class="btn-headline">🖥️ CONNECT VIA BASE STATION</span>
      <span class="btn-subtext">Widescreen CRT console, legacy diagnostic boards & full keyboard</span>
    </a>
  </div>

</body>
</html>
