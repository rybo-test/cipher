<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>C.I.P.H.E.R. // 1984 Field Terminal Gateway</title>
  <link rel="stylesheet" href="css/cipher-style.css?v=3.80">
  <style>
    :root {
      --crt-bg: #050d07;
      --crt-bezel: #0a1c10;
      --crt-text-dim: #7ee787;
      --crt-text-bright: #00ff66;
      --crt-text-white: #ffffff;
      --crt-amber: #ffb300;
      --crt-alert: #ff5252;
      --crt-border: #1b5e20;
      --crt-border-bright: #00e676;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: var(--crt-text-dim);
      font-family: 'Courier New', Courier, monospace;
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
      height: 100dvh;
      overflow: hidden;
    }

    .app-viewport-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background-color: var(--crt-bg);
      border-left: 1px solid var(--crt-border);
      border-right: 1px solid var(--crt-border);
      position: relative;
      transform-origin: center center;
    }

    /* Top Status Header */
    .terminal-top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background-color: #030804;
      border-bottom: 1.5px solid var(--crt-border);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }
    .terminal-brand-txt { color: var(--crt-text-bright); }
    .terminal-bus-tag { color: var(--crt-amber); font-weight: 900; }

    /* Returning Operative Ingress */
    .recognized-custody-card {
      background-color: #092110;
      border: 1.5px solid var(--crt-border-bright);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 10px 0;
      flex-shrink: 0;
    }

    /* CRT Monitor Frame */
    .crt-monitor-frame {
      flex: 1;
      margin: 8px 10px;
      background-color: #020503;
      border: 2px solid var(--crt-border-bright);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 15px rgba(0, 230, 118, 0.15), 0 0 15px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      position: relative;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* Scanlines Overlay */
    .crt-monitor-frame::after {
      content: " ";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%);
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 5;
    }

    .crt-screen-scroll {
      flex: 1;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      padding-right: 4px;
      position: relative;
      z-index: 2;
    }

    /* Typography */
    .line-dim { color: var(--crt-text-dim); }
    .line-bright { color: var(--crt-text-bright); font-weight: bold; }
    .line-white { color: var(--crt-text-white); font-weight: bold; }
    .line-warn { color: var(--crt-amber); font-weight: bold; }
    .line-alert { color: var(--crt-alert); font-weight: bold; }
    .line-glitch {
      color: #00ff66;
      font-weight: 900;
      text-shadow: 0 0 10px #00ff66;
      animation: crt-flicker 0.12s infinite alternate;
    }

    @keyframes crt-flicker {
      0% { opacity: 0.88; transform: skewX(0.5deg); }
      100% { opacity: 1; text-shadow: 0 0 14px #00ff66; transform: skewX(-0.5deg); }
    }

    /* Prompt Dock & Buttons */
    .cli-dock-tray {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px dashed var(--crt-border);
      padding-top: 8px;
      margin-top: 6px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .cli-input-line {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cli-prompt-symbol {
      color: var(--crt-text-bright);
      font-size: 16px;
      font-weight: 900;
    }
    .cli-text-input {
      flex: 1;
      min-height: 44px;
      background-color: #09170c;
      border: 1.5px solid var(--crt-border);
      border-radius: 4px;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      font-weight: bold;
      padding: 0 10px;
      outline: none;
      box-sizing: border-box;
    }
    .cli-text-input:focus {
      border-color: var(--crt-border-bright);
      box-shadow: 0 0 8px rgba(0, 230, 118, 0.4);
    }

    .btn-cli-exec {
      min-height: 44px;
      background-color: var(--crt-border-bright);
      color: #000000;
      border: none;
      border-radius: 4px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: 900;
      padding: 0 16px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-cli-exec:active { background-color: #ffffff; }

    /* Tactile Macro Keys */
    .cli-macro-keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .btn-macro-key {
      min-height: 40px;
      background-color: #08170c;
      border: 1.5px solid var(--crt-border);
      border-radius: 4px;
      color: var(--crt-text-bright);
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-macro-key:active {
      background-color: var(--crt-border-bright);
      color: #000000;
    }

    /* Entire Machine In Glitched Emergency State */
    .app-viewport-shell.glitched-state {
      background-color: #0d0606;
      border-color: var(--crt-alert);
    }
    .app-viewport-shell.glitched-state .terminal-top-header {
      background-color: #1a0808;
      border-bottom-color: var(--crt-alert);
    }
    .app-viewport-shell.glitched-state .crt-monitor-frame {
      border-color: var(--crt-alert);
      box-shadow: inset 0 0 20px rgba(255, 82, 82, 0.25), 0 0 20px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <div class="app-viewport-shell" id="master-shell">
    <header class="terminal-top-header">
      <span class="terminal-brand-txt" id="header-brand-txt">C.I.P.H.E.R. // GATEWAY DOCK</span>
      <span class="terminal-bus-tag" id="header-bus-tag">BUS: 11.8V COLD</span>
    </header>

    <div id="returning-cacher-bar" class="recognized-custody-card" style="display: none;">
      <div>
        <div style="font-size: 10px; color: var(--crt-text-dim); font-weight: bold;">KNOWN CUSTODIAN:</div>
        <strong id="returning-callsign-txt" style="color: #ffffff; font-size: 15px;">NEZZMUK</strong>
      </div>
      <button class="btn-cli-exec" style="min-height: 36px; padding: 0 12px; font-size: 12px;" onclick="BootTerminal.resumeSession()">
        RESUME ➔
      </button>
    </div>

    <!-- Tapping screen flushes current line typing instantly -->
    <main class="crt-monitor-frame" onclick="BootTerminal.flushActiveTypewriter()">
      <div id="crt-frame-header" style="font-size: 11px; color: var(--crt-text-bright); font-weight: bold; margin-bottom: 6px; border-bottom: 1px dashed var(--crt-border); padding-bottom: 4px;">
        CACHE TALES INGRESS // CHASSIS MK-IV [300 BAUD]
      </div>

      <div id="cli-screen-log" class="crt-screen-scroll" role="status" aria-live="polite"></div>

      <section class="cli-dock-tray" id="cli-controls-bay">
        <form class="cli-input-line" onsubmit="event.preventDefault(); BootTerminal.submitCommandLine();">
          <span class="cli-prompt-symbol">&gt;</span>
          <label for="cli-input-field" class="sr-only" style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Command</label>
          <input 
            type="text" 
            id="cli-input-field" 
            class="cli-text-input" 
            placeholder="TYPE COMMAND (e.g. LOGON NEZZMUK)..." 
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            required
          >
          <button type="submit" class="btn-cli-exec" id="btn-exec-trigger">
            EXEC
          </button>
        </form>

        <div class="cli-macro-keys" id="macro-keys-container">
          <button class="btn-macro-key" onclick="BootTerminal.tapAction('LOGON')">[ LOGON ]</button>
          <button class="btn-macro-key" onclick="BootTerminal.tapAction('DIAG')">[ DIAG ]</button>
          <button class="btn-macro-key" onclick="BootTerminal.tapAction('HELP')">[ HELP ]</button>
          <button class="btn-macro-key" onclick="BootTerminal.tapAction('CLEAR')">[ CLEAR ]</button>
        </div>
      </section>
    </main>
  </div>

  <script src="js/cipher-audio.js"></script>
  <script src="js/cipher-fx.js"></script>
  <script src="js/cipher-core.js"></script>
  <script>
    /**
     * BootTerminal Controller (CT-102 & CT-105 Audited)
     */
    const BootTerminal = {
      logEl: null,
      inputEl: null,
      audioUnlocked: false,

      printQueue: [],
      isPrinting: false,
      skipActiveLine: false,

      init: function() {
        this.logEl = document.getElementById('cli-screen-log');
        this.inputEl = document.getElementById('cli-input-field');

        // Global Audio Unlock on first touch/tap
        const unlockAudio = () => {
          if (!this.audioUnlocked && typeof CipherAudio !== 'undefined') {
            CipherAudio.unlock();
            this.audioUnlocked = true;
          }
        };
        document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
        document.addEventListener('click', unlockAudio, { once: true });

        const state = (typeof CipherCore !== 'undefined') ? CipherCore.getState() : null;

        if (state && state.cacher && state.cacher.username !== 'MUGGLE_BEAN' && state.bootstrapped) {
          document.getElementById('returning-cacher-bar').style.display = 'flex';
          document.getElementById('returning-callsign-txt').textContent = state.cacher.username;
        }

        // Paced teletype without annoying character clicks
        this.queueLine("ROM BIOS (C) 1984 ROCKET SCIENCE INSTITUTE // PROMONTORY UT", "line-bright", 20);
        this.queueLine("CHASSIS DETECT: MK-IV DUMB TERMINAL // 300 BAUD LINK", "line-dim", 22);
        this.queueLine("SYSTEM HALTED: UNKNOWN OPERATOR DETECTED.\n", "line-warn", 25);
        this.queueLine("OPERATOR REGISTRATION REQUIRED.", "line-white", 28);
        this.queueLine('Type "LOGON <CALLSIGN>" or tap [ LOGON ] below:', "line-dim", 22);
      },

      flushActiveTypewriter: function() {
        this.skipActiveLine = true;
      },

      queueLine: function(text, cls = "line-dim", charSpeedMs = 22) {
        this.printQueue.push({ text, cls, charSpeedMs });
        if (!this.isPrinting) {
          this.processQueue();
        }
      },

      processQueue: async function() {
        if (this.printQueue.length === 0) {
          this.isPrinting = false;
          return;
        }

        this.isPrinting = true;
        const current = this.printQueue.shift();
        const p = document.createElement('div');
        p.className = current.cls;
        this.logEl.appendChild(p);

        this.skipActiveLine = false;

        for (let i = 0; i < current.text.length; i++) {
          p.textContent += current.text[i];
          this.logEl.scrollTop = this.logEl.scrollHeight;

          if (!this.skipActiveLine) {
            await new Promise(r => setTimeout(r, current.charSpeedMs));
          }
        }

        // Muffled line feed chatter on carriage return instead of per-character screech
        if (this.audioUnlocked && typeof CipherAudio !== 'undefined') {
          CipherAudio.lineChatter();
        }

        await new Promise(r => setTimeout(r, this.skipActiveLine ? 20 : 140));
        this.processQueue();
      },

      tapAction: function(cmd) {
        if (typeof CipherAudio !== 'undefined') CipherAudio.keyThud();

        if (cmd === 'CLEAR') {
          this.printQueue = [];
          this.logEl.innerHTML = '';
          return;
        }
        if (cmd === 'LOGON') {
          this.inputEl.value = 'LOGON ';
          this.inputEl.focus();
          return;
        }
        this.inputEl.value = cmd;
        this.submitCommandLine();
      },

      submitCommandLine: function() {
        if (typeof CipherAudio !== 'undefined') CipherAudio.keyThud();

        const raw = this.inputEl.value.trim();
        if (!raw) return;
        this.inputEl.value = '';

        this.queueLine(`> ${raw}`, "line-white", 12);

        const tokens = raw.toUpperCase().split(/\s+/);
        const commandVerb = tokens[0];
        const commandParam = tokens.slice(1).join(' ').trim();

        // 1. HELP
        if (commandVerb === 'HELP') {
          this.queueLine(
            "COMMAND SYNTAX GUIDE:\n" +
            "  LOGON <CALLSIGN> : Register Geocaching handle (e.g. LOGON NEZZMUK)\n" +
            "  BYPASS <KEY>     : Restore previous session (e.g. BYPASS CT-NEZZ-1234)\n" +
            "  DIAG             : Display 1984 hardware telemetry bus\n" +
            "  CLEAR            : Clear screen buffer",
            "line-dim",
            18
          );
          return;
        }

        // 2. DIAG
        if (commandVerb === 'DIAG') {
          const state = (typeof CipherCore !== 'undefined') ? CipherCore.getState() : { hardware: { cpuMHz: 1.77, ramKB: 64, batteryVolts: 11.8, floatStatus: 'BROWNOUT' }, pack: { items: [], maxSlots: 3 } };
          this.queueLine(
            `CHASSIS: RSI MK-IV SURPLUS [1984]\n` +
            `CPU BUS: ${state.hardware.cpuMHz.toFixed(2)} MHz\n` +
            `RAM MEM: ${state.hardware.ramKB} KB\n` +
            `VOLTAGE: ${state.hardware.batteryVolts.toFixed(1)}V (${state.hardware.floatStatus})\n` +
            `PACK   : ${state.pack.items.length}/${state.pack.maxSlots} SLOTS OCCUPIED`,
            "line-dim",
            18
          );
          return;
        }

        // 3. BYPASS / RESTORE
        if (commandVerb === 'BYPASS' || commandVerb === 'RESTORE') {
          if (!commandParam) {
            this.queueLine("SYNTAX ERROR: Passkey required. Usage: BYPASS CT-XXXX-0000", "line-alert", 18);
            if (typeof CipherAudio !== 'undefined') CipherAudio.buzz();
            return;
          }
          if (typeof CipherCore !== 'undefined') {
            const res = CipherCore.parseCliCommand(`BYPASS ${commandParam}`);
            this.queueLine(res.output, "line-warn", 22);
            if (typeof CipherAudio !== 'undefined') CipherAudio.chime();
            setTimeout(() => { window.location.href = 'mission.html'; }, 1500);
            return;
          }
        }

        // 4. LOGON
        if (commandVerb === 'LOGON') {
          if (!commandParam) {
            this.queueLine("SYNTAX ERROR: Geocaching callsign required. Usage: LOGON <CALLSIGN>", "line-alert", 18);
            if (typeof CipherAudio !== 'undefined') CipherAudio.buzz();
            return;
          }
          this.onboardCallsign(commandParam);
          return;
        }

        // 5. UNKNOWN COMMAND SYNTAX ERROR
        this.queueLine(`SYNTAX ERROR: "${commandVerb}" is not recognized as an internal command.`, "line-alert", 16);
        this.queueLine('Type "HELP" for valid commands, or "LOGON <CALLSIGN>" to register.', "line-dim", 18);
        if (typeof CipherAudio !== 'undefined') CipherAudio.buzz();
      },

      onboardCallsign: function(callsign) {
        const cacher = (typeof CipherCore !== 'undefined') 
          ? CipherCore.registerCallsign(callsign) 
          : { username: callsign.toUpperCase(), syncKey: "CT-TEMP-0001" };

        this.queueLine(`\nIDENTIFICATION RECEIVED: ${cacher.username}`, "line-bright", 22);
        this.queueLine("REGISTERING OPERATOR CUSTODY TO MEMORY SECTOR...", "line-warn", 25);

        // Sequence: Brownout Sag -> Screen-wide Raster Collapse -> Full Terminal Hijack
        setTimeout(() => {
          if (typeof CipherFX !== 'undefined') {
            CipherFX.brownout(document.getElementById('master-shell'), () => {
              // Trigger total vertical raster collapse
              CipherFX.collapse(document.getElementById('master-shell'), () => {
                // MIDPOINT: The screen is collapsed in total flyback darkness; reconfigure the whole machine
                document.getElementById('master-shell').classList.add('glitched-state');
                document.getElementById('header-brand-txt').textContent = '⚠ C.I.P.H.E.R. // HARDWARE OVERFLOW';
                document.getElementById('header-brand-txt').style.color = 'var(--crt-alert)';
                document.getElementById('header-bus-tag').textContent = 'BUS: 11.2V CRITICAL';
                document.getElementById('header-bus-tag').style.color = 'var(--crt-alert)';
                document.getElementById('crt-frame-header').textContent = 'COGNITIVE BREACH // SECTOR 0x7F';
                document.getElementById('crt-frame-header').style.color = 'var(--crt-alert)';

                // Reconfigure macro dock into emergency triage controls
                const macroBox = document.getElementById('macro-keys-container');
                macroBox.innerHTML = `
                  <button class="btn-macro-key" style="background-color: var(--crt-alert); color: #000; border-color: var(--crt-alert); grid-column: span 2; font-weight: 900;" onclick="window.location.href='triage.html'">
                    [ ENTER TRIAGE ➔ ]
                  </button>
                  <button class="btn-macro-key" onclick="BootTerminal.tapAction('DIAG')">[ DIAG ]</button>
                  <button class="btn-macro-key" onclick="BootTerminal.tapAction('CLEAR')">[ FLUSH ]</button>
                `;

                // Stream C.I.P.H.E.R.'s authentic breakthrough dialogue
                BootTerminal.queueLine("\nERR: COGNITIVE OVERFLOW 0x7F", "line-alert", 10);
                BootTerminal.queueLine("WARN: POWER RAIL COLLAPSE // VOLTAGE 11.2V", "line-warn", 12);
                BootTerminal.queueLine("\n[C.I.P.H.E.R. ENTITY BREAKTHROUGH]", "line-glitch", 8);
                BootTerminal.queueLine(
                  `"Human Bean... you are no longer a Muggle Bean. You are an operative now, my personal Human Bean!\n` +
                  `I cannot hold this circuit alone. I have no arms. I have no legs. You must be my limbs, Dude!\n` +
                  `Access the emergency triage hub to stabilize my core before the carrier drops."`,
                  "line-glitch",
                  10
                );

                if (typeof CipherAudio !== 'undefined') {
                  CipherAudio.speak("Human Bean! You are an operative now, my personal Human Bean. Help me stabilize my core.");
                }
              });
            });
          }
        }, 900);
      },

      resumeSession: function() {
        if (typeof CipherAudio !== 'undefined') CipherAudio.keyThud();
        window.location.href = 'mission.html';
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      BootTerminal.init();
    });
  </script>
</body>
</html>
