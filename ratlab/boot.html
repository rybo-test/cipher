<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>C.I.P.H.E.R. // Handheld Ingress</title>
  <link rel="stylesheet" href="css/cipher-style.css?v=3.80">
  <style>
    :root {
      --crt-bg: #050d07;
      --crt-bezel: #0a1c10;
      --crt-text-dim: #7ee787;
      --crt-text-bright: #00ff66;
      --crt-text-white: #ffffff;
      --crt-amber: #ffb300;
      --crt-alert: #ff5252;
      --crt-border: #1b5e20;
      --crt-border-bright: #00e676;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: var(--crt-text-dim);
      font-family: 'Courier New', Courier, monospace;
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
      height: 100dvh;
      overflow: hidden;
    }

    .app-viewport-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background-color: var(--crt-bg);
      border-left: 1px solid var(--crt-border);
      border-right: 1px solid var(--crt-border);
      position: relative;
      transform-origin: center center;
    }

    .terminal-top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background-color: #030804;
      border-bottom: 1.5px solid var(--crt-border);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }
    .terminal-brand-txt { color: var(--crt-text-bright); }
    .terminal-bus-tag { color: var(--crt-amber); font-weight: 900; }

    .recognized-custody-card {
      background-color: #092110;
      border: 1.5px solid var(--crt-border-bright);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 10px 0;
      flex-shrink: 0;
    }

    .crt-monitor-frame {
      flex: 1;
      margin: 8px 10px;
      background-color: #020503;
      border: 2px solid var(--crt-border-bright);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 15px rgba(0, 230, 118, 0.15), 0 0 15px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      position: relative;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .crt-monitor-frame::after {
      content: " ";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%);
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 5;
    }

    .crt-screen-scroll {
      flex: 1;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      padding-right: 4px;
      position: relative;
      z-index: 2;
    }

    .line-dim { color: var(--crt-text-dim); }
    .line-bright { color: var(--crt-text-bright); font-weight: bold; }
    .line-white { color: var(--crt-text-white); font-weight: bold; }
    .line-warn { color: var(--crt-amber); font-weight: bold; }
    .line-alert { color: var(--crt-alert); font-weight: bold; }
    .line-glitch {
      color: #00ff66;
      font-weight: 900;
      text-shadow: 0 0 10px #00ff66;
    }

    .cli-dock-tray {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px dashed var(--crt-border);
      padding-top: 8px;
      margin-top: 6px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .cli-input-line {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cli-prompt-symbol {
      color: var(--crt-text-bright);
      font-size: 16px;
      font-weight: 900;
    }
    .cli-text-input {
      flex: 1;
      min-height: 44px;
      background-color: #09170c;
      border: 1.5px solid var(--crt-border);
      border-radius: 4px;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      font-weight: bold;
      padding: 0 10px;
      outline: none;
      box-sizing: border-box;
    }
    .cli-text-input:focus {
      border-color: var(--crt-border-bright);
      box-shadow: 0 0 8px rgba(0, 230, 118, 0.4);
    }

    .btn-cli-exec {
      min-height: 44px;
      background-color: var(--crt-border-bright);
      color: #000000;
      border: none;
      border-radius: 4px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: 900;
      padding: 0 16px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-cli-exec:active { background-color: #ffffff; }

    .cli-macro-keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .btn-macro-key {
      min-height: 40px;
      background-color: #08170c;
      border: 1.5px solid var(--crt-border);
      border-radius: 4px;
      color: var(--crt-text-bright);
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      text-align: center;
      padding: 2px 4px;
    }
    .btn-macro-key:active {
      background-color: var(--crt-border-bright);
      color: #000000;
    }
    .btn-macro-key.alert-action {
      background-color: var(--crt-alert) !important;
      color: #000000 !important;
      font-weight: 900 !important;
      grid-column: span 4 !important;
      min-height: 44px;
    }

    .app-viewport-shell.glitched-state {
      background-color: #0d0606;
      border-color: var(--crt-alert);
    }
    .app-viewport-shell.glitched-state .terminal-top-header {
      background-color: #1a0808;
      border-bottom-color: var(--crt-alert);
    }
    .app-viewport-shell.glitched-state .crt-monitor-frame {
      border-color: var(--crt-alert);
      box-shadow: inset 0 0 20px rgba(255, 82, 82, 0.25), 0 0 20px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <div class="app-viewport-shell" id="master-shell">
    <header class="terminal-top-header">
      <span class="terminal-brand-txt" id="header-brand-txt">RSI HANDHELD // ACCESS POINT</span>
      <span class="terminal-bus-tag" id="header-bus-tag">POWER: 11.9V FLOATING</span>
    </header>

    <div id="returning-cacher-bar" class="recognized-custody-card" style="display: none;">
      <div>
        <div style="font-size: 10px; color: var(--crt-text-dim); font-weight: bold;">KNOWN USER:</div>
        <strong id="returning-callsign-txt" style="color: #ffffff; font-size: 15px;">NEZZMUK</strong>
      </div>
      <button class="btn-cli-exec" style="min-height: 36px; padding: 0 12px; font-size: 12px;" onclick="BootTerminal.resumeSession()">
        RESUME ➔
      </button>
    </div>

    <main class="crt-monitor-frame" onclick="BootTerminal.flushActiveTypewriter()">
      <div id="crt-frame-header" style="font-size: 11px; color: var(--crt-text-bright); font-weight: bold; margin-bottom: 6px; border-bottom: 1px dashed var(--crt-border); padding-bottom: 4px;">
        PORTABLE LINK // SIGNAL PACKETS DETECTED
      </div>

      <div id="cli-screen-log" class="crt-screen-scroll" role="status" aria-live="polite"></div>

      <section class="cli-dock-tray" id="cli-controls-bay">
        <form class="cli-input-line" onsubmit="event.preventDefault(); BootTerminal.submitCommandLine();">
          <span class="cli-prompt-symbol">&gt;</span>
          <label for="cli-input-field" class="sr-only" style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Command</label>
          <input 
            type="text" 
            id="cli-input-field" 
            class="cli-text-input" 
            placeholder="TYPE COMMAND (e.g. LOGON NEZZMUK)..." 
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            required
          >
          <button type="submit" class="btn-cli-exec" id="btn-exec-trigger">
            EXEC
          </button>
        </form>

        <div class="cli-macro-keys" id="macro-keys-container"></div>
      </section>
    </main>
  </div>

  <script src="js/cipher-audio.js"></script>
  <script src="js/cipher-fx.js"></script>
  <script src="js/cipher-core.js"></script>
  <script src="js/cipher-dialog.js"></script>
  <script>
    const BootTerminal = {
      logEl: null,
      inputEl: null,
      buttonsBay: null,

      printQueue: [],
      isPrinting: false,
      skipActiveLine: false,

      init: function() {
        this.logEl = document.getElementById('cli-screen-log');
        this.inputEl = document.getElementById('cli-input-field');
        this.buttonsBay = document.getElementById('macro-keys-container');

        const unlockAudio = () => {
          if (typeof CipherAudio !== 'undefined') CipherAudio.unlock();
        };
        window.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
        window.addEventListener('click', unlockAudio, { once: true });

        // Initialize dialogue stage
        const initialStage = CipherDialog.init('POCKET_TERMINAL_INGRESS');
        if (initialStage) {
          this.printLine(initialStage.screenText, "line-bright", 16);
          if (initialStage.buttons) {
            this.renderButtons(initialStage.buttons);
          }
        }
      },

      flushActiveTypewriter: function() {
        this.skipActiveLine = true;
      },

      printLine: function(text, cls = "line-dim", charSpeedMs = 16) {
        this.printQueue.push({ text, cls, charSpeedMs });
        if (!this.isPrinting) {
          this.processQueue();
        }
      },

      processQueue: async function() {
        if (this.printQueue.length === 0) {
          this.isPrinting = false;
          return;
        }

        this.isPrinting = true;
        const current = this.printQueue.shift();
        const p = document.createElement('div');
        p.className = current.cls;
        this.logEl.appendChild(p);

        this.skipActiveLine = false;

        for (let i = 0; i < current.text.length; i++) {
          p.textContent += current.text[i];
          this.logEl.scrollTop = this.logEl.scrollHeight;

          if (!this.skipActiveLine) {
            await new Promise(r => setTimeout(r, current.charSpeedMs));
          }
        }

        if (typeof CipherAudio !== 'undefined') {
          CipherAudio.lineChatter();
        }

        await new Promise(r => setTimeout(r, this.skipActiveLine ? 15 : 100));
        this.processQueue();
      },

      renderButtons: function(buttonsList) {
        this.buttonsBay.innerHTML = '';
        const count = buttonsList.length;

        buttonsList.forEach(btn => {
          const b = document.createElement('button');
          b.className = 'btn-macro-key';

          // Single primary button spans full width
          if (btn.textToSend === 'GOTO_REPAIR' || btn.label.includes('ENTER REPAIR')) {
            b.className = 'btn-macro-key alert-action';
            b.onclick = () => {
              if (typeof CipherAudio !== 'undefined') CipherAudio.keyThud();
              localStorage.removeItem('cipher_active_stage');
              window.location.href = 'repair.html';
            };
          } else {
            b.style.gridColumn = count <= 2 ? 'span 2' : (count === 3 ? 'span 1' : 'span 1');
            b.onclick = () => {
              this.tapAction(btn.textToSend);
            };
          }

          b.textContent = btn.label;
          this.buttonsBay.appendChild(b);
        });
      },

      tapAction: function(cmd) {
        if (typeof CipherAudio !== 'undefined') CipherAudio.keyThud();

        if (cmd === 'CLEAR') {
          this.printQueue = [];
          this.logEl.innerHTML = '';
          return;
        }
        if (cmd === 'LOGON ') {
          this.inputEl.value = 'LOGON ';
          this.inputEl.focus();
          return;
        }

        this.inputEl.value = cmd;
        this.submitCommandLine();
      },

      submitCommandLine: function() {
        if (typeof CipherAudio !== 'undefined') CipherAudio.keyThud();

        const raw = this.inputEl.value.trim();
        if (!raw) return;
        this.inputEl.value = '';

        this.printLine(`> ${raw}`, "line-white", 8);

        // Process through Conversation Engine
        const handled = CipherDialog.processInput(raw, this);
        if (handled) return;

        // Fallback CLI commands
        const tokens = raw.toUpperCase().split(/\s+/);
        const verb = tokens[0];
        const param = tokens.slice(1).join(' ').trim();

        if (verb === 'HELP') {
          this.printLine(
            "COMMAND SYNTAX GUIDE:\n" +
            "  LOGON <USERNAME> : Register your geocaching username\n" +
            "  DIAG             : Read handheld telemetry\n" +
            "  CLEAR            : Clear screen buffer",
            "line-dim", 14
          );
          return;
        }

        if (verb === 'DIAG') {
          this.printLine(
            "HARDWARE: RSI HANDHELD MK-IV\n" +
            "SIGNAL  : SIGNAL PACKETS ACTIVE\n" +
            "POWER   : 11.9V FLOATING\n" +
            "STATUS  : READY FOR OPERATOR",
            "line-dim", 14
          );
          return;
        }

        if (verb === 'GOTO_REPAIR' || verb === 'REPAIR') {
          localStorage.removeItem('cipher_active_stage');
          window.location.href = 'repair.html';
          return;
        }

        this.printLine(`SYNTAX ERROR: "${verb}" is not recognized.`, "line-alert", 14);
        this.printLine('Type "HELP" or tap an action key to continue.', "line-dim", 14);
        if (typeof CipherAudio !== 'undefined') CipherAudio.buzz();
      },

      resumeSession: function() {
        if (typeof CipherAudio !== 'undefined') CipherAudio.keyThud();
        window.location.href = 'mission.html';
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      BootTerminal.init();
    });
  </script>
</body>
</html>
