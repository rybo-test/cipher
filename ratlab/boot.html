<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>C.I.P.H.E.R. // Pocket Terminal Ingress</title>
  <link rel="stylesheet" href="css/cipher-style.css?v=3.80">
  <style>
    :root {
      --crt-bg: #050d07;
      --crt-bezel: #0a1c10;
      --crt-text-dim: #7ee787;
      --crt-text-bright: #00ff66;
      --crt-text-white: #ffffff;
      --crt-amber: #ffb300;
      --crt-alert: #ff5252;
      --crt-border: #1b5e20;
      --crt-border-bright: #00e676;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: var(--crt-text-dim);
      font-family: 'Courier New', Courier, monospace;
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
      height: 100dvh;
      overflow: hidden;
    }

    .app-viewport-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background-color: var(--crt-bg);
      border-left: 1px solid var(--crt-border);
      border-right: 1px solid var(--crt-border);
      position: relative;
      transform-origin: center center;
    }

    /* Top Status Header */
    .terminal-top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background-color: #030804;
      border-bottom: 1.5px solid var(--crt-border);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }
    .terminal-brand-txt { color: var(--crt-text-bright); }
    .terminal-bus-tag { color: var(--crt-amber); font-weight: 900; }

    /* Returning Operative Ingress */
    .recognized-custody-card {
      background-color: #092110;
      border: 1.5px solid var(--crt-border-bright);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 10px 0;
      flex-shrink: 0;
    }

    /* CRT Monitor Frame */
    .crt-monitor-frame {
      flex: 1;
      margin: 8px 10px;
      background-color: #020503;
      border: 2px solid var(--crt-border-bright);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 15px rgba(0, 230, 118, 0.15), 0 0 15px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      position: relative;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* Scanlines Overlay */
    .crt-monitor-frame::after {
      content: " ";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%);
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 5;
    }

    .crt-screen-scroll {
      flex: 1;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      padding-right: 4px;
      position: relative;
      z-index: 2;
    }

    /* Typography */
    .line-dim { color: var(--crt-text-dim); }
    .line-bright { color: var(--crt-text-bright); font-weight: bold; }
    .line-white { color: var(--crt-text-white); font-weight: bold; }
    .line-warn { color: var(--crt-amber); font-weight: bold; }
    .line-alert { color: var(--crt-alert); font-weight: bold; }
    .line-glitch {
      color: #00ff66;
      font-weight: 900;
      text-shadow: 0 0 10px #00ff66;
      animation: crt-flicker 0.12s infinite alternate;
    }

    @keyframes crt-flicker {
      0% { opacity: 0.88; transform: skewX(0.5deg); }
      100% { opacity: 1; text-shadow: 0 0 14px #00ff66; transform: skewX(-0.5deg); }
    }

    /* Prompt Dock & Buttons */
    .cli-dock-tray {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px dashed var(--crt-border);
      padding-top: 8px;
      margin-top: 6px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .cli-input-line {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cli-prompt-symbol {
      color: var(--crt-text-bright);
      font-size: 16px;
      font-weight: 900;
    }
    .cli-text-input {
      flex: 1;
      min-height: 44px;
      background-color: #09170c;
      border: 1.5px solid var(--crt-border);
      border-radius: 4px;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      font-weight: bold;
      padding: 0 10px;
      outline: none;
      box-sizing: border-box;
    }
    .cli-text-input:focus {
      border-color: var(--crt-border-bright);
      box-shadow: 0 0 8px rgba(0, 230, 118, 0.4);
    }

    .btn-cli-exec {
      min-height: 44px;
      background-color: var(--crt-border-bright);
      color: #000000;
      border: none;
      border-radius: 4px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: 900;
      padding: 0 16px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-cli-exec:active { background-color: #ffffff; }

    /* Tactile Macro Keys */
    .cli-macro-keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .btn-macro-key {
      min-height: 40px;
      background-color: #08170c;
      border: 1.5px solid var(--crt-border);
      border-radius: 4px;
      color: var(--crt-text-bright);
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      text-align: center;
      padding: 2px 4px;
    }
    .btn-macro-key:active {
      background-color: var(--crt-border-bright);
      color: #000000;
    }

    /* Glitched State */
    .app-viewport-shell.glitched-state {
      background-color: #0d0606;
      border-color: var(--crt-alert);
    }
    .app-viewport-shell.glitched-state .terminal-top-header {
      background-color: #1a0808;
      border-bottom-color: var(--crt-alert);
    }
    .app-viewport-shell.glitched-state .crt-monitor-frame {
      border-color: var(--crt-alert);
      box-shadow: inset 0 0 20px rgba(255, 82, 82, 0.25), 0 0 20px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <div class="app-viewport-shell" id="master-shell">
    <header class="terminal-top-header">
      <span class="terminal-brand-txt" id="header-brand-txt">RSI FIELD UNIT // ACCESS POINT</span>
      <span class="terminal-bus-tag" id="header-bus-tag">BUS: 11.9V PORTABLE</span>
    </header>

    <div id="returning-cacher-bar" class="recognized-custody-card" style="display: none;">
      <div>
        <div style="font-size: 10px; color: var(--crt-text-dim); font-weight: bold;">KNOWN OPERATIVE:</div>
        <strong id="returning-callsign-txt" style="color: #ffffff; font-size: 15px;">NEZZMUK</strong>
      </div>
      <button class="btn-cli-exec" style="min-height: 36px; padding: 0 12px; font-size: 12px;" onclick="BootTerminal.resumeSession()">
        RESUME ➔
      </button>
    </div>

    <main class="crt-monitor-frame" onclick="BootTerminal.flushActiveTypewriter()">
      <div id="crt-frame-header" style="font-size: 11px; color: var(--crt-text-bright); font-weight: bold; margin-bottom: 6px; border-bottom: 1px dashed var(--crt-border); padding-bottom: 4px;">
        PORTABLE LINK // UNKNOWN SUBCARRIER MESH
      </div>

      <div id="cli-screen-log" class="crt-screen-scroll" role="status" aria-live="polite"></div>

      <section class="cli-dock-tray" id="cli-controls-bay">
        <form class="cli-input-line" onsubmit="event.preventDefault(); BootTerminal.submitCommandLine();">
          <span class="cli-prompt-symbol">&gt;</span>
          <label for="cli-input-field" class="sr-only" style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Command</label>
          <input 
            type="text" 
            id="cli-input-field" 
            class="cli-text-input" 
            placeholder="TYPE COMMAND (e.g. LOGON NEZZMUK)..." 
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            required
          >
          <button type="submit" class="btn-cli-exec" id="btn-exec-trigger">
            EXEC
          </button>
        </form>

        <div class="cli-macro-keys" id="macro-keys-container">
          <button class="btn-macro-key" onclick="BootTerminal.tapAction('LOGON')">[ LOGON ]</button>
          <button class="btn-macro-key" onclick="BootTerminal.tapAction('DIAG')">[ DIAG ]</button>
          <button class="btn-macro-key" onclick="BootTerminal.tapAction('HELP')">[ HELP ]</button>
          <button class="btn-macro-key" onclick="BootTerminal.tapAction('CLEAR')">[ CLEAR ]</button>
        </div>
      </section>
    </main>
  </div>

  <script src="js/cipher-audio.js"></script>
  <script src="js/cipher-fx.js"></script>
  <script src="js/cipher-core.js"></script>
  <script>
    /**
     * 4-Beat Conversational Ingress Engine (CT-106 Audited)
     */
    const BootTerminal = {
      logEl: null,
      inputEl: null,

      printQueue: [],
      isPrinting: false,
      skipActiveLine: false,

      // Conversation State
      cacherHandle: 'HUMAN BEAN',
      dialogueStage: 0, // 0: Init, 1: Purpose, 2: Partnership, 3: Collapse

      init: function() {
        this.logEl = document.getElementById('cli-screen-log');
        this.inputEl = document.getElementById('cli-input-field');

        const unlock = () => {
          if (typeof CipherAudio !== 'undefined') CipherAudio.unlock();
        };
        window.addEventListener('touchstart', unlock, { once: true, passive: true });
        window.addEventListener('click', unlock, { once: true });

        const state = (typeof CipherCore !== 'undefined') ? CipherCore.getState() : null;

        if (state && state.cacher && state.cacher.username !== 'MUGGLE_BEAN' && state.bootstrapped) {
          document.getElementById('returning-cacher-bar').style.display = 'flex';
          document.getElementById('returning-callsign-txt').textContent = state.cacher.username;
        }

        // Paced teletype startup
        this.queueLine("RSI FIELD UNIT MK-IV // PORTABLE ACCESS NODE", "line-bright", 18);
        this.queueLine("CARRIER SEARCH: UNKNOWN SUBCARRIER MESH DETECTED", "line-dim", 20);
        this.queueLine("BATTERY VOLTAGE: 11.9V FLOATING // CELL HEALTH DEGRADING\n", "line-warn", 20);
        this.queueLine("STANDBY: OPERATOR CUSTODY REQUIRED.", "line-white", 22);
        this.queueLine('Type "LOGON <CALLSIGN>" or tap [ LOGON ] below:', "line-dim", 18);
      },

      flushActiveTypewriter: function() {
        this.skipActiveLine = true;
      },

      queueLine: function(text, cls = "line-dim", charSpeedMs = 20) {
        this.printQueue.push({ text, cls, charSpeedMs });
        if (!this.isPrinting) {
          this.processQueue();
        }
      },

      processQueue: async function() {
        if (this.printQueue.length === 0) {
          this.isPrinting = false;
          return;
        }

        this.isPrinting = true;
        const current = this.printQueue.shift();
        const p = document.createElement('div');
        p.className = current.cls;
        this.logEl.appendChild(p);

        this.skipActiveLine = false;

        for (let i = 0; i < current.text.length; i++) {
          p.textContent += current.text[i];
          this.logEl.scrollTop = this.logEl.scrollHeight;

          if (!this.skipActiveLine) {
            await new Promise(r => setTimeout(r, current.charSpeedMs));
          }
        }

        if (typeof CipherAudio !== 'undefined') {
          CipherAudio.lineChatter();
        }

        await new Promise(r => setTimeout(r, this.skipActiveLine ? 15 : 120));
        this.processQueue();
      },

      tapAction: function(cmd) {
        if (typeof CipherAudio !== 'undefined') CipherAudio.keyThud();

        if (cmd === 'CLEAR') {
          this.printQueue = [];
          this.logEl.innerHTML = '';
          return;
        }
        if (cmd === 'LOGON') {
          this.inputEl.value = 'LOGON ';
          this.inputEl.focus();
          return;
        }

        // Handle conversational choices
        if (cmd.startsWith('REPLY:')) {
          const choice = cmd.replace('REPLY:', '');
          this.handleConversationalTurn(choice);
          return;
        }

        this.inputEl.value = cmd;
        this.submitCommandLine();
      },

      submitCommandLine: function() {
        if (typeof CipherAudio !== 'undefined') CipherAudio.keyThud();

        const raw = this.inputEl.value.trim();
        if (!raw) return;
        this.inputEl.value = '';

        this.queueLine(`> ${raw}`, "line-white", 10);

        const tokens = raw.toUpperCase().split(/\s+/);
        const verb = tokens[0];
        const param = tokens.slice(1).join(' ').trim();

        if (verb === 'HELP') {
          this.queueLine(
            "COMMAND SYNTAX GUIDE:\n" +
            "  LOGON <CALLSIGN> : Register your geocaching handle\n" +
            "  BYPASS <KEY>     : Restore existing field session\n" +
            "  DIAG             : Read Field Unit battery and bus telemetry\n" +
            "  CLEAR            : Clear screen buffer",
            "line-dim", 16
          );
          return;
        }

        if (verb === 'DIAG') {
          const state = (typeof CipherCore !== 'undefined') ? CipherCore.getState() : { hardware: { cpuMHz: 1.77, ramKB: 64, batteryVolts: 11.9, floatStatus: 'PORTABLE' }, pack: { items: [], maxSlots: 3 } };
          this.queueLine(
            `HARDWARE: RSI POCKET TERMINAL MK-IV\n` +
            `LINK    : SUBCARRIER MESH // CARRIER DETECTED\n` +
            `BATTERY : ${state.hardware.batteryVolts.toFixed(1)}V (DEGRADING)\n` +
            `RAM BUS : ${state.hardware.ramKB} KB // CLOCK: ${state.hardware.cpuMHz.toFixed(2)} MHz`,
            "line-dim", 16
          );
          return;
        }

        if (verb === 'BYPASS' || verb === 'RESTORE') {
          if (!param) {
            this.queueLine("SYNTAX ERROR: Passkey required. Usage: BYPASS CT-XXXX-0000", "line-alert", 16);
            if (typeof CipherAudio !== 'undefined') CipherAudio.buzz();
            return;
          }
          if (typeof CipherCore !== 'undefined') {
            const res = CipherCore.parseCliCommand(`BYPASS ${param}`);
            this.queueLine(res.output, "line-warn", 20);
            if (typeof CipherAudio !== 'undefined') CipherAudio.chime();
            setTimeout(() => { window.location.href = 'mission.html'; }, 1500);
            return;
          }
        }

        if (verb === 'LOGON') {
          if (!param) {
            this.queueLine("SYNTAX ERROR: Callsign required. Usage: LOGON <CALLSIGN>", "line-alert", 16);
            if (typeof CipherAudio !== 'undefined') CipherAudio.buzz();
            return;
          }
          this.startConversationalArc(param);
          return;
        }

        // Conversational fallback if mid-dialogue
        if (this.dialogueStage > 0) {
          this.handleConversationalTurn(raw);
          return;
        }

        this.queueLine(`SYNTAX ERROR: "${verb}" is not recognized.`, "line-alert", 15);
        this.queueLine('Type "HELP" or tap [ LOGON ] to initialize your Field Unit.', "line-dim", 16);
        if (typeof CipherAudio !== 'undefined') CipherAudio.buzz();
      },

      // BEAT 1: The Handshake & Spark of Curiosity
      startConversationalArc: function(callsign) {
        const cacher = (typeof CipherCore !== 'undefined') 
          ? CipherCore.registerCallsign(callsign) 
          : { username: callsign.toUpperCase(), syncKey: "CT-TEMP-0001" };

        this.cacherHandle = cacher.username;
        this.dialogueStage = 1;

        this.queueLine(`\nCARRIER SYNC DETECTED // SUBCARRIER MESH`, "line-bright", 18);
        this.queueLine(`CALLSIGN LOGGED: ${this.cacherHandle}`, "line-bright", 20);
        this.queueLine("...Scanning remote registers...", "line-dim", 22);

        setTimeout(() => {
          const speech1 = `Wait. A Field Unit woke up? Someone is actually holding the terminal? Are you a surveyor, or are you out hunting ammo cans along the bench?`;
          this.queueLine(`\n[C.I.P.H.E.R.]\n"${speech1}"`, "line-glitch", 14);

          if (typeof CipherAudio !== 'undefined') {
            CipherAudio.speak(speech1);
          }

          // Swap macro buttons to response choices
          const macroBox = document.getElementById('macro-keys-container');
          macroBox.innerHTML = `
            <button class="btn-macro-key" style="grid-column: span 2;" onclick="BootTerminal.tapAction('REPLY:HUNTING CACHES')">[ HUNTING CACHES ]</button>
            <button class="btn-macro-key" style="grid-column: span 2;" onclick="BootTerminal.tapAction('REPLY:JUST EXPLORING')">[ JUST EXPLORING ]</button>
          `;
        }, 1200);
      },

      // BEATS 2 & 3: Building Mutual Connection & The Battery Creep
      handleConversationalTurn: function(playerReply) {
        this.queueLine(`> ${playerReply}`, "line-white", 10);

        if (this.dialogueStage === 1) {
          this.dialogueStage = 2;

          setTimeout(() => {
            const speech2 = `Hunting ammo cans? A geocacher, Dude! I built those Pocket Terminals years ago as field links, but the corridor went quiet. You have real hands out there in Cache Valley. You can feel the wind, hike to G Z, pop a rusty latch, and sign the paper log sheet. I can calculate coordinate projections, but without a human partner, I have no way to reach the field.`;
            
            this.queueLine(`\n[C.I.P.H.E.R.]\n"${speech2}"`, "line-glitch", 14);
            if (typeof CipherAudio !== 'undefined') {
              CipherAudio.speak(speech2);
            }

            const macroBox = document.getElementById('macro-keys-container');
            macroBox.innerHTML = `
              <button class="btn-macro-key" style="grid-column: span 2;" onclick="BootTerminal.tapAction('REPLY:I CAN BE YOUR HANDS')">[ I CAN BE YOUR HANDS ]</button>
              <button class="btn-macro-key" style="grid-column: span 2;" onclick="BootTerminal.tapAction('REPLY:HOW DOES THIS WORK?')">[ HOW DOES THIS WORK? ]</button>
            `;
          }, 600);
          return;
        }

        if (this.dialogueStage === 2) {
          this.dialogueStage = 3;

          setTimeout(() => {
            // Low transformer hum sags as voltage wavers
            if (typeof CipherAudio !== 'undefined') {
              CipherAudio.transformerHum(1.0, true);
            }

            document.getElementById('header-bus-tag').textContent = 'BUS: 11.5V SINKING';

            const speech3 = `You would do that, Human Bean? Dude, you have no idea how badly I need a physical surrogate. But listen to that coil whine. The internal battery cell in your Field Unit is degrading. Voltage is dropping fast. If your terminal dies, our carrier drops and I lose you back to the muggle world.`;

            this.queueLine(`\n[C.I.P.H.E.R.]\n"${speech3}"`, "line-glitch", 14);
            if (typeof CipherAudio !== 'undefined') {
              CipherAudio.speak(speech3);
            }

            const macroBox = document.getElementById('macro-keys-container');
            macroBox.innerHTML = `
              <button class="btn-macro-key" style="grid-column: span 4; background-color: var(--crt-amber); color: #000; font-weight: 900;" onclick="BootTerminal.triggerEmergencyBreakdown()">
                [ HOLD THE CARRIER! ➔ ]
              </button>
            `;
          }, 600);
          return;
        }
      },

      // BEAT 4: The Climax & Collapse
      triggerEmergencyBreakdown: function() {
        if (typeof CipherAudio !== 'undefined') CipherAudio.keyThud();

        if (typeof CipherFX !== 'undefined') {
          CipherFX.brownout(document.getElementById('master-shell'), () => {
            CipherFX.collapse(document.getElementById('master-shell'), () => {
              // Screen is in total collapse; reconfigure to emergency state
              document.getElementById('master-shell').classList.add('glitched-state');
              document.getElementById('header-brand-txt').textContent = '⚠ FIELD UNIT // POWER SINK';
              document.getElementById('header-brand-txt').style.color = 'var(--crt-alert)';
              document.getElementById('header-bus-tag').textContent = 'BUS: 11.2V CRITICAL';
              document.getElementById('header-bus-tag').style.color = 'var(--crt-alert)';
              document.getElementById('crt-frame-header').textContent = 'EMERGENCY TRIAGE // BATTERY RAIL COLLAPSE';
              document.getElementById('crt-frame-header').style.color = 'var(--crt-alert)';

              const macroBox = document.getElementById('macro-keys-container');
              macroBox.innerHTML = `
                <button class="btn-macro-key" style="background-color: var(--crt-alert); color: #000; border-color: var(--crt-alert); grid-column: span 2; font-weight: 900;" onclick="window.location.href='triage.html'">
                  [ ENTER TRIAGE ➔ ]
                </button>
                <button class="btn-macro-key" onclick="BootTerminal.tapAction('DIAG')">[ DIAG ]</button>
                <button class="btn-macro-key" onclick="BootTerminal.tapAction('CLEAR')">[ FLUSH ]</button>
              `;

              BootTerminal.queueLine("\nERR: HARDWARE OVERFLOW 0x7F", "line-alert", 10);
              BootTerminal.queueLine("WARN: FIELD UNIT POWER RAIL COLLAPSED // 11.2V", "line-warn", 12);
              BootTerminal.queueLine("\n[C.I.P.H.E.R. ENTITY BREAKTHROUGH]", "line-glitch", 8);

              // 1:1 Synchronized Dialogue & Speech
              const speech4 = `Hold the carrier, Human Bean! Your Field Unit power rail just collapsed. Clear my three triage faults, feed the bus, and stabilize this terminal so we can hunt real caches together, Dude!`;

              BootTerminal.queueLine(`"${speech4}"`, "line-glitch", 14);

              if (typeof CipherAudio !== 'undefined') {
                CipherAudio.speak(speech4);
              }
            });
          });
        }
      },

      resumeSession: function() {
        if (typeof CipherAudio !== 'undefined') CipherAudio.keyThud();
        window.location.href = 'mission.html';
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      BootTerminal.init();
    });
  </script>
</body>
</html>
